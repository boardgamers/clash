name: Web viewer
on:
  pull_request:
    paths: ['web-client/**', 'server/**', 'Cargo.*', '.github/workflows/web-viewer.yml']
  push:
    branches: [main, feat/3d-web-viewer]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2025.7.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
        working-directory: web-client
      - run: npm run build:bridge && npm run check && npm test && npm run build
        working-directory: web-client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clash-viewer
          path: web-client/dist/viewer.js
