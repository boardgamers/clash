name: Web viewer
on:
  pull_request:
    paths: ['web-client/**', 'server/**', 'Cargo.*', '.github/workflows/web-viewer.yml']
  push:
    branches: [main, feat/3d-web-viewer]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2025.12.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
        working-directory: web-client
      - run: npm run build:bridge && npm run check && npm test && npm run build
        working-directory: web-client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clash-viewer
          path: web-client/dist/
